[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "directa-mcp"
version = "0.1.0"
description = "MCP server exposing Directa SIM's Darwin API (dAPI) as tools for Claude"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Simone Busoli" }
]
dependencies = [
  "mcp>=1.6.0,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
directa-mcp = "directa_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
