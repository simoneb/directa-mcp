name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows is where this actually runs — Darwin is Windows-only — but the
    # client and its tests are platform-independent, and Linux catches
    # accidental Windows assumptions in code that claims to be portable.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install --system -e ".[dev]"
      - run: pytest -q
