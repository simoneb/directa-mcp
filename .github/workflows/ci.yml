name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows is where this actually runs — Darwin is Windows-only — but the
    # client and its tests are platform-independent, and Linux catches
    # accidental Windows assumptions in code that claims to be portable.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # The environment is created explicitly rather than installed into with
      # --system: uv's own managed interpreters are marked externally managed
      # and refuse it, and on Windows a --system install puts pytest somewhere
      # the shell's PATH does not reach. `uv run` then resolves the venv on
      # both runners without either of them needing an activation step.
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -q
