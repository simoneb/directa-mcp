name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows is where this actually runs — Darwin is Windows-only — but the
    # client and its tests are platform-independent, and Linux catches
    # accidental Windows assumptions in code that claims to be portable.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # Installing with --system was wrong on both runners: uv's own managed
      # interpreters are marked externally managed and refuse it, and on Windows
      # it puts pytest outside the PATH the shell searches. The venv is what to
      # install into instead — setup-uv already provisions one, hence
      # --allow-existing, which also keeps this working if it stops doing so.
      # `uv run` then finds it without a per-shell activation step.
      - run: uv venv --allow-existing
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -q
